<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Server 4 — MovieBox Hindi Anime Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #f7f7f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    .player-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      outline: none;
    }
    .top-badge-bar {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }
    .badge-server {
      background: #f47521;
      color: #111;
    }
    .badge-hindi {
      background: rgba(30, 144, 255, 0.85);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .badge-format {
      background: rgba(20, 24, 33, 0.85);
      color: #46d369;
      border: 1px solid rgba(70, 211, 105, 0.4);
    }
    .title-label {
      margin-left: auto;
      font-size: 13px;
      font-weight: 700;
      color: #e5e7eb;
      background: rgba(10, 12, 18, 0.75);
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45%;
    }
    .player-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(5, 7, 13, 0.92);
      z-index: 20;
      padding: 24px;
      text-align: center;
      gap: 16px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: #f47521;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .overlay-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .overlay-sub {
      font-size: 13px;
      color: #9ca3af;
      max-width: 420px;
      line-height: 1.5;
    }
    .btn-action {
      appearance: none;
      border: 0;
      background: #f47521;
      color: #111;
      font-size: 13px;
      font-weight: 800;
      padding: 10px 20px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn-action:hover {
      background: #ff8c3b;
      transform: scale(1.04);
    }
    .btn-secondary {
      background: #1f2430;
      color: #f3f4f6;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .btn-secondary:hover {
      background: #2b3140;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="player-container" id="playerContainer">
    <div class="top-badge-bar" id="badgeBar">
      <span class="badge badge-server">Server 4</span>
      <span class="badge badge-hindi">Hindi Dub</span>
      <span class="badge badge-format" id="formatBadge">HLS .m3u8</span>
      <span class="title-label" id="titleLabel">Anime</span>
    </div>

    <video id="videoElement" controls playsinline preload="auto"></video>
    <iframe id="embedFrame" allowfullscreen allow="autoplay; fullscreen; encrypted-media; picture-in-picture" style="width:100%;height:100%;border:0;background:#000;" hidden></iframe>

    <div class="player-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <h2 class="overlay-title" id="loadingTitle">Resolving MovieBox Stream…</h2>
      <p class="overlay-sub" id="loadingSub">Extracting direct Hindi audio stream via MovieBox proxy.</p>
    </div>

    <div class="player-overlay" id="errorOverlay" hidden>
      <h2 class="overlay-title" id="errorTitle">Stream Unavailable</h2>
      <p class="overlay-sub" id="errorSub">MovieBox is currently resolving or buffering this title. Tap Retry to reconnect.</p>
      <div class="btn-row">
        <button class="btn-action" id="retryBtn">↻ Retry Stream</button>
        <button class="btn-action btn-secondary" id="directEpisodeBtn">↻ Reconnect Stream</button>
      </div>
    </div>
  </div>

  <script src="hls.min.js"></script>
  <script>
    if (typeof Hls === 'undefined') {
      var cdnScript = document.createElement('script');
      cdnScript.src = 'https://cdn.jsdelivr.net/npm/hls.js@1';
      document.head.appendChild(cdnScript);
    }
  </script>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var title = params.get('title') || 'Solo Leveling';
      var season = params.get('season') || params.get('se') || '1';
      var ep = params.get('ep') || '1';
      var lang = params.get('lang') || 'hi';
      var key = params.get('key') || '';
      var fileId = params.get('file_id') || params.get('fid') || '';
      var showId = params.get('show_id') || '';
      var epIdx = params.get('ep_idx') || '';
      var nxId = params.get('nx_id') || '';
      var nxKind = params.get('nx_kind') || 'tv';
      var directSrc = params.get('src') || '';
      var subjectId = params.get('id') || '';

      var video = document.getElementById('videoElement');
      var embedFrame = document.getElementById('embedFrame');
      var titleLabel = document.getElementById('titleLabel');
      var formatBadge = document.getElementById('formatBadge');
      var loadingOverlay = document.getElementById('loadingOverlay');
      var errorOverlay = document.getElementById('errorOverlay');
      var retryBtn = document.getElementById('retryBtn');
      var directEpisodeBtn = document.getElementById('directEpisodeBtn');
      var currentHls = null;

      titleLabel.textContent = title + ' · S' + season + ' E' + ep;

      // Seed mapping for confirmed anime files if parameters weren't passed
      var KNOWN_EPISODES = {
        'solo': { showId: 1138, firstFid: '144U5FdhfBjG-nTnQ72xiljp8syd_qoMS' },
        'demon': { showId: 983, firstFid: '1ux-XvWHe-PMeE4UVe6Ko5x07AO37Czy3' },
        'jjk': { showId: 814, firstFid: '1-2-GpMCf9m9FUq0LxGozoKG3Du3wzHTy' },
        'onepiece': { showId: 358, firstFid: '1SaJT7Mey304sFmpnuvhkQ9MzN7Rx265U' },
        'bluelock': { showId: 237, firstFid: '17kMCC211hB9f0D-F_zyux6GXM4VO6K1z' },
        'aot': { nxId: 'tt2560140', nxKind: 'tv' },
        'tokyo': { nxId: '105009', nxKind: 'tv' },
        'vinland': { nxId: 'tt10233448', nxKind: 'tv' }
      };

      function hideOverlays() {
        loadingOverlay.hidden = true;
        errorOverlay.hidden = true;
      }

      function showError(titleMsg, descMsg) {
        loadingOverlay.hidden = true;
        errorOverlay.hidden = false;
        if (titleMsg) document.getElementById('errorTitle').textContent = titleMsg;
        if (descMsg) document.getElementById('errorSub').textContent = descMsg;
      }

      function onPlaySuccess() {
        hideOverlays();
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'moviebox:playing' }, '*');
          }
        } catch (e) {}
      }

      function attachStream(streamUrl, kind, quality) {
        if (quality) formatBadge.textContent = (kind === 'hls' ? 'HLS ' : '') + quality;

        // Clean up previous HLS instance
        if (currentHls) {
          try { currentHls.destroy(); } catch(e) {}
          currentHls = null;
        }

        embedFrame.hidden = true;
        embedFrame.src = 'about:blank';
        video.hidden = false;

        video.pause();
        video.removeAttribute('src');
        video.load();

        video.onerror = function() {
          console.warn('Video element reported error loading direct stream:', streamUrl);
          showError('Stream Connection Error', 'The stream encountered a connection glitch. Tap Retry to reconnect.');
        };

        hideOverlays();

        var isHls = (kind === 'hls') || (streamUrl && streamUrl.indexOf('.m3u8') !== -1);

        if (isHls && typeof Hls !== 'undefined' && Hls.isSupported()) {
          var hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
          });
          currentHls = hls;
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, function() {
            onPlaySuccess();
            var playPromise = video.play();
            if (playPromise && playPromise.catch) playPromise.catch(function() {});
          });
          hls.on(Hls.Events.ERROR, function(event, data) {
            if (data.fatal) {
              switch (data.type) {
                case Hls.ErrorTypes.NETWORK_ERROR:
                  console.warn('HLS Network error, attempting recovery...');
                  hls.startLoad();
                  break;
                case Hls.ErrorTypes.MEDIA_ERROR:
                  console.warn('HLS Media error, attempting recovery...');
                  hls.recoverMediaError();
                  break;
                default:
                  console.warn('HLS Fatal error:', data);
                  hls.destroy();
                  showError('Playback Interrupted', 'MovieBox stream encountered a network issue. Tap Retry.');
                  break;
              }
            }
          });
        } else {
          // Native HLS (Safari/iOS/Android) or MP4
          video.src = streamUrl;
          video.onloadeddata = function() { onPlaySuccess(); };
          var playPromise = video.play();
          if (playPromise && playPromise.catch) playPromise.catch(function() {});
        }
      }

      function fetchMovieboxStream() {
        loadingOverlay.hidden = false;
        errorOverlay.hidden = true;

        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'moviebox:ready' }, '*');
          }
        } catch (e) {}

        if (directSrc) {
          attachStream(directSrc, 'hls', '1080P');
          return;
        }

        var apiUrl = '/api/moviebox/stream?title=' + encodeURIComponent(title) +
                     '&se=' + encodeURIComponent(season) +
                     '&ep=' + encodeURIComponent(ep) +
                     '&lang=' + encodeURIComponent(lang);
        if (key) apiUrl += '&key=' + encodeURIComponent(key);
        if (fileId) apiUrl += '&file_id=' + encodeURIComponent(fileId);
        if (showId) apiUrl += '&show_id=' + encodeURIComponent(showId);
        if (epIdx !== '') apiUrl += '&ep_idx=' + encodeURIComponent(epIdx);
        if (nxId) apiUrl += '&nx_id=' + encodeURIComponent(nxId);
        if (subjectId) apiUrl += '&id=' + encodeURIComponent(subjectId);

        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timeoutId = controller ? setTimeout(function() { controller.abort(); }, 12000) : null;

        fetch(apiUrl, { signal: controller ? controller.signal : undefined })
          .then(function(res) {
            if (timeoutId) clearTimeout(timeoutId);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function(data) {
            var streamUrl = (data && (data.stream || data.proxied || data.rawStream)) || '';
            var q = (data && data.quality) || 'Hindi 1080P';
            var f = (data && data.format) || 'hls';
            if (streamUrl) {
              attachStream(streamUrl, f, q);
            } else {
              showError('Stream Connecting…', 'MovieBox Hindi stream is synchronizing for this title. Tap Retry.');
            }
          })
          .catch(function(err) {
            if (timeoutId) clearTimeout(timeoutId);
            console.warn('MovieBox stream fetch error:', err);
            showError('Stream Reconnecting…', 'Connecting to MovieBox Hindi stream server. Tap Retry to reconnect.');
          });
      }

      retryBtn.addEventListener('click', function() {
        fetchMovieboxStream();
      });

      directEpisodeBtn.addEventListener('click', function() {
        fetchMovieboxStream();
      });

      // Start initial extraction
      fetchMovieboxStream();
    })();
  </script>
</body>
</html>
