name: MovieBox hosts probe

# Diagnostic only. Owner: "koi aacha server moviebox ka copy dhundo" — kaunse
# MovieBox front domains + unka BFF abhi zinda hain, ye runner (asli internet)
# se check hota hai. Result PR comment me aata hai.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe hosts
        run: node scripts/probe-moviebox-hosts.mjs 2>&1 | tee probe.log
      - name: Post result as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### MovieBox hosts probe'
            echo '```'
            tail -c 6000 probe.log || true
            echo '```'
          } > body.md
          gh pr comment "$PR" --body-file body.md || cat body.md
