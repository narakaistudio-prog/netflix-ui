name: vidsync-probe

# Temporary probe (Task 24): kya vidsync.pro ka embed hamare origin se iframe me
# chalne deta hai (X-Frame-Options / CSP frame-ancestors) aur kaunsa status deta
# hai. Runner ke paas internet hai — sandbox ke paas nahi. Logs runner host par
# hote hain (yahan se download nahi hote), isliye result commit comment me post
# hota hai — wahi padha jaata hai.
on:
  workflow_dispatch:
  push:
    branches: [arena/eb80d9dc-netflix-ui]
    paths:
      - '.github/workflows/vidsync-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Embed headers (mobile UA)
        run: |
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36"
          OUT=/tmp/out.md
          : > $OUT
          for u in \
            "https://vidsync.pro/" \
            "https://vidsync.pro/embed/movie/155" \
            "https://vidsync.pro/embed/movie/1184918?dubLang=hindi&primarycolor=E50914" \
            "https://vidsync.pro/embed/movie/1465943?dubLang=hindi&primarycolor=E50914" \
            "https://vidsync.pro/embed/tv/66732/1/1?dubLang=hindi&primarycolor=E50914" ; do
            echo "### $u" >> $OUT
            curl -sS -m 30 -A "$UA" -H 'Accept-Language: en-IN,en;q=0.9' -D /tmp/h -o /tmp/b "$u" || echo "curl exit $?" >> $OUT
            echo '```' >> $OUT
            head -1 /tmp/h >> $OUT
            grep -iE 'x-frame-options|content-security-policy|referrer-policy|server:|cf-|x-vercel|x-powered|content-type' /tmp/h >> $OUT || echo '(no frame/csp headers)' >> $OUT
            echo "body bytes: $(wc -c < /tmp/b)" >> $OUT
            echo '```' >> $OUT
            echo 'body head:' >> $OUT
            echo '```html' >> $OUT
            head -c 300 /tmp/b | tr -d '\r' >> $OUT
            echo >> $OUT
            echo '```' >> $OUT
            echo >> $OUT
          done
          cat $OUT
          python3 - "$OUT" <<'PY'
          import json,sys,urllib.request,os
          body=open(sys.argv[1]).read()
          sha=os.environ['GITHUB_SHA']; repo=os.environ['GITHUB_REPOSITORY']; tok=os.environ['GH_TOKEN']
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
              data=json.dumps({"body":"## vidsync.pro probe\n\n"+body}).encode(),
              headers={"Authorization":f"Bearer {tok}","Accept":"application/vnd.github+json","Content-Type":"application/json"},
              method="POST")
          print(urllib.request.urlopen(req).status)
          PY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
