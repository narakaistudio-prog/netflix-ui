name: probe nxsha onepiece

on:
  push:
    paths:
      - '.github/workflows/probe-nxsha-onepiece.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harvest the One Piece guide from Nxsha
        env:
          NX_GUIDE_ONLY: onepiece
          NX_GUIDE_MERGE: '1'
        run: node scripts/harvest-nxsha-guide.mjs
      - name: Bake the page
        run: node scripts/bake-animahd-links.mjs
      - name: Commit
        run: |
          git config user.name "nxsha-guide-bot"
          git config user.email "nxsha-guide-bot@users.noreply.github.com"
          git add data/nxsha-titles.json data/nxsha-plan.json data/nxsha-episodes.json data/nxsha-harvest-report.json data/nxsha-verify.json assets/crunchyroll/crunchyroll.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(nxsha): harvest the One Piece episode guide"
            for i in 1 2 3; do
              git push origin HEAD:${{ github.ref_name }} && break
              sleep 5
              git pull --rebase origin ${{ github.ref_name }}
            done
          fi
