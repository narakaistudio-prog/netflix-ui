name: Probe Nxsha One Piece
# Temporary: refresh the One Piece guide on this branch so the season map can be
# checked against real data. Removed before the branch merges.

on:
  push:
    branches:
      - arena/90e9ce59-netflix-ui
    paths:
      - '.github/workflows/probe-nxsha-onepiece.yml'
      - 'scripts/harvest-nxsha-guide.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Harvest the One Piece guide only
        run: node scripts/harvest-nxsha-guide.mjs --only onepiece --merge

      - name: Show the harvest report
        run: node -e "const r=require('./data/nxsha-harvest-report.json'); console.log(JSON.stringify(r.summary), JSON.stringify(r.titles.map(t=>({key:t.key,ok:t.ok,error:t.error,seasons:t.seasons?Object.keys(t.seasons).length:0,episodes:t.episodes,stills:t.stills})), null, 1))"

      - name: Bake the guide into the page
        run: |
          node scripts/bake-animahd-links.mjs
          node scripts/bake-animahd-links.mjs --check

      - name: Commit
        run: |
          git config user.name 'toonstream-bot'
          git config user.email 'toonstream-bot@users.noreply.github.com'
          git add data/nxsha-episodes.json data/nxsha-titles.json data/nxsha-plan.json data/nxsha-harvest-report.json assets/crunchyroll/crunchyroll.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: probe One Piece Nxsha guide'
          git push
