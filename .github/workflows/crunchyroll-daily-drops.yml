name: Crunchyroll daily Fresh Toon

# Once a day this keeps the Crunchyroll page's anime rails current:
#
#   1. ToonStream season layout -> the season numbers/counts every anime card
#      shows (data/toonstream-seasons.json; scripts/harvest-toonstream-seasons.mjs)
#   2. ToonStream home rail     -> the "Fresh Drop Toon" row, one card per anime,
#      with the Nxsha episode metadata mapped onto ToonStream's seasons
#      (data/toonstream-drops.json; scripts/harvest-toonstream-drops.mjs)
#   3. both bakes               -> TS_SEASONS + TS_DROPS in
#      assets/crunchyroll/crunchyroll.html, verified with --check.
#
# DeadToons is no longer part of the daily rail: ToonStream is the source for
# both the drop and the season layout. Every step degrades safely — a failed
# harvest leaves yesterday's block in place rather than blanking the page.
#
# GitHub runs a "schedule" trigger only from the default branch, so until this
# branch is merged the daily run has to be started by a push to a listed branch.
#
# Commits made with GITHUB_TOKEN do not start other workflows.
on:
  schedule:
    # 04:00 UTC every day, which is 09:30 in India.
    - cron: '0 4 * * *'
  push:
    branches:
      # Har kaam wali branch par bhi ek run — taaki bake usi branch me chade
      # jahan page ka code badla. Pehle yahan ek hardcoded branch naam tha jo
      # har session ke baad stale ho jata tha (isliye naye branch par row
      # refresh nahi hoti thi). Ab sabhi arena branches.
      - main
      - 'arena/**'
    paths:
      - '.github/workflows/crunchyroll-daily-drops.yml'
      - 'scripts/harvest-toonstream-seasons.mjs'
      - 'scripts/harvest-toonstream-drops.mjs'
      - 'scripts/lib/seasons.mjs'
      - 'scripts/lib/text.mjs'
      - 'api/toonstream.mjs'
  workflow_dispatch:

concurrency:
  group: crunchyroll-drops-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  drops:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Harvest the ToonStream season layout for the catalog
        id: seasons
        continue-on-error: true
        run: node scripts/harvest-toonstream-seasons.mjs

      - name: Harvest the ToonStream Fresh Drop rail (Nxsha episode metadata)
        id: toonstream
        continue-on-error: true
        run: node scripts/harvest-toonstream-drops.mjs

      - name: Bake the states into the page and verify
        run: |
          # A failed harvest keeps yesterday's block untouched.
          if [ -f data/toonstream-seasons.json ]; then
            node scripts/harvest-toonstream-seasons.mjs --from-state
            node scripts/harvest-toonstream-seasons.mjs --check
          else
            echo "No ToonStream season state yet (harvest did not complete)."
          fi
          if [ -f data/toonstream-drops.json ]; then
            node scripts/harvest-toonstream-drops.mjs --from-state
            node scripts/harvest-toonstream-drops.mjs --check
          else
            echo "No ToonStream drop state yet (harvest did not complete)."
          fi

      - name: Summarize the rails
        run: |
          node -e "
            const seasons = require('./data/toonstream-seasons.json');
            const drops = require('./data/toonstream-drops.json');
            const shows = Object.values(seasons.shows || {});
            const layouts = shows.reduce((n, s) => n + Object.keys(s.seasons || {}).length, 0);
            console.log('ToonStream seasons: ' + shows.length + ' anime, ' + layouts + ' seasons baked');
            if (seasons.misses && seasons.misses.length) {
              console.log('Not found on ToonStream: ' + seasons.misses.map(m => m.title).join(', '));
            }
            console.log('Fresh Drop Toon: ' + Object.keys(drops.items || {}).length + ' cards');
            console.log('Episode guides: ' + Object.values(drops.items || {}).filter(i => i.guide).length);
          " | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.seasons.outcome }}" != "success" ]; then
            echo "ToonStream season harvest did not complete — previous layouts kept." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ steps.toonstream.outcome }}" != "success" ]; then
            echo "ToonStream drop harvest did not complete — previous rail kept." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit the drops states and the page block
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add assets/crunchyroll/crunchyroll.html
          if [ -f data/toonstream-seasons.json ]; then
            git add data/toonstream-seasons.json
          fi
          if [ -f data/toonstream-drops.json ]; then
            git add data/toonstream-drops.json
          fi
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore(crunchyroll): refresh ToonStream seasons + the Fresh Drop rail"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      # 2026-10-23 tak drops harvest chup-chaap fail ho raha tha (series page par
      # HTTP 500) aur `continue-on-error` ki wajah se run green dikhta tha —
      # row 4 din purani state par jam gayi. Ab kaam ke baad run red hoga, taaki
      # pata chale ki aaj ka refresh nahi hua.
      - name: Fail loudly when a harvest did not complete
        if: steps.seasons.outcome != 'success' || steps.toonstream.outcome != 'success'
        run: |
          echo "ToonStream harvest did not complete — yesterday's block was kept."
          echo "seasons=${{ steps.seasons.outcome }} drops=${{ steps.toonstream.outcome }}"
          exit 1

      - name: Trigger the production Vercel deploy hook when configured
        if: github.ref_name == 'main'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; relying on Vercel's Git integration."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL"
