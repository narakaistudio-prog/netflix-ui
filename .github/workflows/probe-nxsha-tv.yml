name: Probe nxsha TV seasons (temporary)

# Diagnostic only: prints where nxsha serves TV season 2+ episode lists.
# The output is committed to data/probe-nxsha-tv.txt so it can be read from the repo.
# Remove once the episode builder is in place.
on:
  push:
    branches:
      - arena/12789678-netflix-ui
    paths:
      - '.github/workflows/probe-nxsha-tv.yml'
      - 'scripts/probe-nxsha-tv.mjs'
  workflow_dispatch:

concurrency:
  group: probe-nxsha-tv-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe
        run: node scripts/probe-nxsha-tv.mjs > data/probe-nxsha-tv.txt 2>&1 || true
      - name: Commit the probe output
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/probe-nxsha-tv.txt
          if git diff --cached --quiet; then echo "No change."; else
            git commit -m "chore(probe): nxsha TV season output"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
