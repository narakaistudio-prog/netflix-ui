name: Probe episode cards
# Temporary: inspect ToonStream season markup for the two episodes whose cards
# still fall back to the placeholder, then refresh the harvest on this branch.
# Removed before the branch merges.

on:
  push:
    branches:
      - arena/90e9ce59-netflix-ui
    paths:
      - '.github/workflows/probe-episode-cards.yml'
      - 'tmp-probe/cards.mjs'
      - 'scripts/lib/seasons.mjs'
      - 'scripts/harvest-toonstream-seasons.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tmp-probe/cards.mjs
      - name: Harvest the ToonStream layout and stills
        run: node scripts/harvest-toonstream-seasons.mjs
      - name: Bake the season blocks and verify them
        run: |
          node scripts/harvest-toonstream-seasons.mjs --from-state
          node scripts/harvest-toonstream-seasons.mjs --from-state --check
      - name: Commit the probe notes and the refresh
        run: |
          git config user.name 'toonstream-bot'
          git config user.email 'toonstream-bot@users.noreply.github.com'
          git add probe-cards.txt data/toonstream-seasons.json assets/crunchyroll/crunchyroll.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: probe card markup and refresh ToonStream stills'
          git push
