name: Fill Trending row from Nxsha

# The "Trending Now in India" row needs details and images that only nxsha.space
# has. The sandbox cannot reach nxsha, so this job runs on a hosted runner,
# fills that one row in data/movies.json, and commits it. It never reads or
# writes the Crunchyroll data (data/nxsha-*, crunchyroll.html).
on:
  push:
    branches:
      - arena/12789678-netflix-ui
    paths:
      - '.github/workflows/trending-nxsha.yml'
      - 'scripts/build-trending-nxsha.mjs'
  workflow_dispatch:

concurrency:
  group: trending-nxsha-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fill the Trending row from Nxsha
        run: node scripts/build-trending-nxsha.mjs

      - name: Commit the Trending row
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/movies.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore(trending): fill Trending Now in India from Nxsha"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
