name: MovieBox browser probe (push)

# Temporary diagnostic. `pull_request` event is not firing reliably on this
# branch, isliye probe branch ke push par chalta hai. Kuch deploy nahi karta;
# result job summary me (aur log me) aata hai.
on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Browser-view probe (preflight + streams + CDN)
        env:
          PROBE_ORIGIN: 'https://net-ki15.vercel.app'
        run: |
          set -o pipefail
          node scripts/probe-moviebox-browser.mjs \
            --subject-id 4151920426815471968 \
            --detail-path mandaadi-hindi-qxUx1r3QHW4 \
            --se 0 --ep 0 2>&1 | tee browser-probe.log
      - name: Page probe (watch page HTML + doosre hosts)
        run: |
          set -o pipefail
          node scripts/probe-moviebox-page.mjs \
            --slug mandaadi-hindi-qxUx1r3QHW4 --id 4151920426815471968 2>&1 | tee page-probe.log
      - name: Popular titles probe (kya hasResource false geo hai ya global)
        run: |
          set -o pipefail
          for t in Wednesday Inception "Stranger Things"; do
            echo "===== $t"
            node scripts/probe-moviebox-play.mjs --title "$t" 2>&1 | grep -E "picked|status|hasResource|streams|body:" | head -8 || true
          done | tee popular-probe.log
      # Runner ka log host ephemeral hai (`gh run view --log` khaali aata hai),
      # isliye result PR comment me — wahan se `gh pr view --comments` padha ja
      # sakta hai.
      - name: PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### MovieBox probe — browser nazariya'
            echo '```'
            tail -c 5000 browser-probe.log || true
            echo '```'
            echo '### MovieBox probe — watch page'
            echo '```'
            tail -c 4000 page-probe.log || true
            echo '```'
            echo '### Popular titles (geo vs global)'
            echo '```'
            tail -c 4000 popular-probe.log || true
            echo '```'
          } > body.md
          gh pr comment 93 --body-file body.md || cat body.md
