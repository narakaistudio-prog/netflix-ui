name: Fill Netflix genre rows from Nxsha

# The home rows built from the Netflix "Indian Movies & TV" genre page
# (data/netflix-genre-100381.txt) need details and images that only nxsha.space
# has. The sandbox cannot reach nxsha, so this job runs on a hosted runner,
# rebuilds those rows in data/movies.json, and commits it. It never reads or
# writes the Crunchyroll data (data/nxsha-*, crunchyroll.html), and it leaves
# the Trending row alone.
on:
  push:
    branches:
      - arena/12789678-netflix-ui
      - arena/31859ef9-netflix-ui
    paths:
      - '.github/workflows/netflix-genre-rows-nxsha.yml'
      - 'data/netflix-genre-100381.txt'
      - 'data/netflix-genre-2638104.txt'
      - 'scripts/build-netflix-genre-rows.mjs'
      - 'scripts/build-trending-nxsha.mjs'
  workflow_dispatch:

# Same group as the Trending job: both rewrite data/movies.json, so run them one at a time.
concurrency:
  group: trending-nxsha-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the Netflix genre rows from Nxsha
        run: |
          node scripts/build-netflix-genre-rows.mjs
          node scripts/build-netflix-genre-rows.mjs --preset=kdrama

      - name: Commit the genre rows
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/movies.json data/netflix-genre-100381.unmatched.txt data/netflix-genre-2638104.unmatched.txt
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore(genre-rows): fill Netflix genre rows from Nxsha"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
