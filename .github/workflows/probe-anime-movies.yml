name: Probe two anime movies (Nxsha + ToonStream)

# Sandbox se nxsha.space / toonstream.us reach nahi hota. "Chainsaw Man Reze
# Arc" aur "Demon Slayer Infinity Castle" ka asli Nxsha id aur ToonStream slug
# sirf live sites se pata chalta hai, isliye ye ek-baar ka probe GitHub Actions
# me chalta hai aur output data/anime-movie-probe.json me commit karta hai.
#
# Temporary: catalog entries likhne ke baad ye workflow + script hata diye
# jayenge (jaise pehle ke probe files).

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/probe-anime-movies.yml'
      - 'scripts/probe-anime-movies.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe Nxsha + ToonStream
        run: node scripts/probe-anime-movies.mjs
      - name: Commit the probe output
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/anime-movie-probe.json
          if git diff --cached --quiet; then
            echo "Koi change nahi."
            exit 0
          fi
          git commit -m "chore: probe Chainsaw Man Reze + Infinity Castle routes"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
