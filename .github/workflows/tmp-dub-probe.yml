name: tmp dub probe
on:
  pull_request:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: chain
        env:
          BASE: https://net-git-arena-e1c5001d-netflix-ui-ki15.vercel.app
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=/tmp/out.txt
          : > $OUT
          echo "### dub probe" >> $OUT
          echo "URL: $BASE" >> $OUT
          RES=$(curl -sS -m 30 "$BASE/api/moviebox-resolve?title=Animal&year=2023&type=movie")
          echo "resolve: ${RES:0:900}" >> $OUT
          SUB=$(echo "$RES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).subjectId||'')}catch(e){console.log('')}})")
          echo "subject: $SUB" >> $OUT
          AUD=$(curl -sS -m 30 "$BASE/api/moviebox-audio?subjectId=$SUB")
          echo "audio: ${AUD:0:1200}" >> $OUT
          P1=$(curl -sS -m 90 "$BASE/api/moviebox-play?subjectId=$SUB&se=1&ep=1&probe=1")
          echo "play 1/1: ${P1:0:2500}" >> $OUT
          P0=$(curl -sS -m 90 "$BASE/api/moviebox-play?subjectId=$SUB&se=0&ep=0&probe=1")
          echo "play 0/0: ${P0:0:2000}" >> $OUT
          echo "status: $(curl -sS -o /dev/null -w '%{http_code}' -m 30 "$BASE/api/moviebox-play?subjectId=$SUB&probe=1")" >> $OUT
          head -c 6000 $OUT
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -f body="$(cat $OUT)" >/dev/null
