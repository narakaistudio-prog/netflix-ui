name: server3-probe

# Temporary probe: Server 3 ke naye candidates (VidSync hata diya).
# Runner ke paas internet hai, sandbox ke paas nahi — isliye nateeja commit
# comment me post hota hai (runner logs yahan se download nahi hote).
on:
  workflow_dispatch:
  push:
    branches: [arena/f7df9bfb-netflix-ui]
    paths:
      - '.github/workflows/server3-probe.yml'
      - 'scripts/probe-server3.mjs'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe candidates
        run: node scripts/probe-server3.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
