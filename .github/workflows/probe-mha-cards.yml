name: Probe MHA cards
# rerun marker: Nxsha guide refreshed
# Temporary: why do MHA S8E12 / Trigun S2E12 still lack a ToonStream still?
# Runs the harvester for just those two shows into /tmp so main state is untouched.

on:
  push:
    branches:
      - arena/90e9ce59-netflix-ui
    paths:
      - '.github/workflows/probe-mha-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harvest only MHA and Trigun into /tmp
        env:
          TS_SEASONS_ONLY: mha,trigun
          TS_SEASONS_DEBUG: '1'
          TS_SEASONS_STATE_FILE: /tmp/probe-state.json
          TS_SEASONS_HTML_FILE: /tmp/probe-page.html
        run: |
          cp assets/crunchyroll/crunchyroll.html /tmp/probe-page.html
          node scripts/harvest-toonstream-seasons.mjs
      - name: Summarise the result
        run: |
          node -e "
          const s=require('/tmp/probe-state.json');
          const out={};
          for(const [k,v] of Object.entries(s.shows)) out[k]={seasons:v.seasons,nxMap:v.nxMap,images:v.images||{}};
          require('fs').writeFileSync('probe-mha.json', JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,1));
          "
      - name: Commit the probe notes
        run: |
          git config user.name 'toonstream-bot'
          git config user.email 'toonstream-bot@users.noreply.github.com'
          git add probe-mha.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: probe MHA and Trigun stills'
          git push origin HEAD:refs/heads/arena/90e9ce59-netflix-ui
