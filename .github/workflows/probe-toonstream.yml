name: probe-toonstream
on:
  push:
    paths:
      - '.github/workflows/probe-toonstream.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch series + episode pages
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          curl -sSL -A "$UA" 'https://toonstream.us/series/ranma1-2/' -o series.html
          echo "series bytes: $(wc -c < series.html)"
          echo '--- episode hrefs ---'
          grep -oE 'href="[^"]*/episode/[^"]*"' series.html | sort -u | head -60
          echo '--- episode markup samples ---'
          grep -oE '.{0,160}/episode/[^" ]{0,60}.{0,160}' series.html | head -6
          echo '--- season words ---'
          grep -oiE '.{0,50}season.{0,50}' series.html | head -20
          echo '--- selects/options ---'
          grep -oE '<select[^>]*>|<option[^>]*>[^<]{0,40}' series.html | head -40
          echo '--- script src ---'
          grep -oE '<script[^>]+src="[^"]+"' series.html | head -20
          echo '--- data attrs ---'
          grep -oE 'data-[a-z-]+="[^"]{0,80}"' series.html | sort -u | head -30
          echo '--- api/ajax urls ---'
          grep -oiE '(https?://[^"'"'"' ]*|/)[a-z0-9_./?=&-]*(ajax|api|episode|season)[a-z0-9_./?=&-]*' series.html | sort -u | head -30

          curl -sSL -A "$UA" 'https://toonstream.us/episode/ranma1-2-3x3/' -o ep.html
          echo "episode bytes: $(wc -c < ep.html)"
          echo '--- episode title/h tags ---'
          grep -oE '<title>[^<]*|<h1[^>]*>[^<]*|<h2[^>]*>[^<]*' ep.html | head -10
          echo '--- server / iframe bits ---'
          grep -oiE '.{0,120}(iframe|server|embed|player).{0,120}' ep.html | head -20
          echo '--- episode links / nav ---'
          grep -oE 'href="[^"]*/episode/[^"]*"' ep.html | sort -u | head -40
          echo '--- selects/options ---'
          grep -oE '<select[^>]*>|<option[^>]*>[^<]{0,40}' ep.html | head -30
          echo '--- scripts ---'
          grep -oE '<script[^>]+src="[^"]+"' ep.html | head -20

      - name: Commit the raw pages for local parsing
        run: |
          mkdir -p tmp-probe
          cp series.html tmp-probe/series.html
          cp ep.html tmp-probe/episode.html
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36'
          curl -sSL -A "$UA" 'https://toonstream.us/s/ranma' -o tmp-probe/search.html
          curl -sSL -A "$UA" 'https://toonstream.us/series/blue-box/' -o tmp-probe/series-blue-box.html || true
          curl -sSL -A "$UA" 'https://toonstream.us/episode/blue-box-2x3/' -o tmp-probe/episode-blue-box.html || true
          ls -l tmp-probe
          git config user.name 'netflix-catalog-bot'
          git config user.email 'netflix-catalog-bot@users.noreply.github.com'
          git add tmp-probe
          git commit -m 'chore: capture toonstream pages' || true
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
