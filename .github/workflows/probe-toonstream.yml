name: Probe ToonStream (temporary)

# TEMPORARY diagnostic: the daily drop harvest silently kept the 2026-10-19
# state, and this sandbox cannot reach toonstream.us. This workflow asks the
# same runner that the daily job uses what the home page actually returns, so
# the failure can be seen without log access. Delete once fixed.
on:
  push:
    branches:
      - arena/bc5f6d17-netflix-ui
    paths:
      - '.github/workflows/probe-toonstream.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the home page and count Fresh Drop cards
        run: |
          node --input-type=module -e "
            import { writeFileSync } from 'node:fs';
            import { _internal } from './api/toonstream.mjs';
            const UA = 'Mozilla/5.0 (compatible; netflix-ui-toonstream-drops/1.0)';
            const out = { ranAt: new Date().toISOString() };
            for (const url of ['https://toonstream.us/home', 'https://toonstream.us/']) {
              const row = {};
              try {
                const res = await fetch(url, { headers: { 'user-agent': UA }, redirect: 'follow' });
                const text = await res.text();
                row.status = res.status;
                row.finalUrl = res.url;
                row.bytes = text.length;
                row.articles = (text.match(/<article/gi) || []).length;
                row.hasFreshDropText = text.includes('Fresh Drop');
                row.docTitle = (text.match(/<title[^>]*>([\s\S]*?)<\/title>/i) || [])[1] || '';
                row.head = text.slice(0, 600);
                try {
                  const items = _internal.parseFreshDrops(text);
                  row.parsed = items.length;
                  row.sample = items.slice(0, 3);
                } catch (error) {
                  row.parseError = String(error && error.message || error);
                }
              } catch (error) {
                row.error = String(error && (error.stack || error.message) || error);
              }
              out[url] = row;
            }
            writeFileSync('data/toonstream-probe.json', JSON.stringify(out, null, 2) + '\n');
          " || echo "probe node failed"
      - name: Commit the probe result
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/toonstream-probe.json
          if git diff --cached --quiet; then
            echo "No probe file."
          else
            git commit -m "chore: toonstream probe"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
