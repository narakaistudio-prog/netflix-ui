name: NetMirror API probe

# Diagnostic only. Owner: "koi aisa server chahiye jo net77.cc ki tarah chale" —
# NetMirror ke REST route (/api/embed-tmdb) ko asli internet se check karta hai.
# Result PR comment me.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe NetMirror API (raw upstream)
        run: node scripts/probe-netmirror-api.mjs 2>&1 | tee probe.log
      - name: Probe api/netmirror.mjs (asli handler, asli upstream)
        run: node scripts/probe-netmirror-handler.mjs 2>&1 | tee -a probe.log
      - name: Post result as PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### NetMirror API probe'
            echo '```'
            tail -c 9000 probe.log || true
            echo '```'
          } > body.md
          gh pr comment "$PR" --body-file body.md || cat body.md
