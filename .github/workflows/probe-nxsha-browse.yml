name: Probe nxsha anime listings (temporary)

# Records what the nxsha anime listing pages and candidate JSON routes return, so
# the Fresh Drops builder can be fixed from real page data. The sandbox cannot reach
# nxsha.space; the result is committed as data/nxsha-browse-probe.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe the listings
        run: node scripts/probe-nxsha-browse.mjs

      - name: Commit the probe result
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/nxsha-browse-probe.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "chore(probe): nxsha anime listing output"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
