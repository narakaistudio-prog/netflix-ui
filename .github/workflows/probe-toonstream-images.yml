name: probe toonstream images

on:
  push:
    paths:
      - '.github/workflows/probe-toonstream-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch a ToonStream season page
        run: |
          mkdir -p probe
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          curl -sSL -A "$UA" "https://toonstream.us/series/demon-slayer-kimetsu-no-yaiba/season/2/" -o probe/demon-s2.html
          curl -sSL -A "$UA" "https://toonstream.us/episode/demon-slayer-kimetsu-no-yaiba-2x9/" -o probe/demon-s2e9.html
          ls -l probe
      - name: Commit the pages
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: capture toonstream season markup"
            for i in 1 2 3; do
              git push origin HEAD:${{ github.ref_name }} && break
              sleep 5
              git pull --rebase origin ${{ github.ref_name }}
            done
          fi
