name: probe toonstream images

on:
  push:
    paths:
      - '.github/workflows/probe-toonstream-images.yml'
      - 'scripts/harvest-toonstream-seasons.mjs'
      - 'scripts/lib/seasons.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Harvest ToonStream seasons, Nxsha maps and episode stills
        run: node scripts/harvest-toonstream-seasons.mjs
      - name: Verify the baked blocks
        run: node scripts/harvest-toonstream-seasons.mjs --from-state --check
      - name: Commit the harvest
        run: |
          git config user.name "toonstream-bot"
          git config user.email "toonstream-bot@users.noreply.github.com"
          git add data/toonstream-seasons.json assets/crunchyroll/crunchyroll.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(crunchyroll): harvest ToonStream stills for episodes Nxsha lacks"
            for i in 1 2 3; do
              git push origin HEAD:${{ github.ref_name }} && break
              sleep 5
              git pull --rebase origin ${{ github.ref_name }}
            done
          fi
