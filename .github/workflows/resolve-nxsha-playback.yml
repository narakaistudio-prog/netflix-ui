name: Resolve Nxsha playback ids (Netflix India catalog)

# Titles without an IMDb/TMDB id show "Play on Netflix" instead of "Play".
# This job runs on a GitHub-hosted runner, which can reach nxsha.space, and
# writes only the ids Nxsha's own embed page confirms into data/movies.json.
# It does not touch the Crunchyroll data (data/nxsha-*, crunchyroll.html).
on:
  push:
    branches:
      - arena/12789678-netflix-ui
    paths:
      - '.github/workflows/resolve-nxsha-playback.yml'
      - 'scripts/resolve-nxsha-playback.mjs'
  workflow_dispatch:

concurrency:
  group: resolve-nxsha-playback-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout the requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve and verify Nxsha ids
        run: node scripts/resolve-nxsha-playback.mjs

      - name: Commit verified catalog ids
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/movies.json data/catalog-playback-resolve.json
          if git diff --cached --quiet; then
            echo "No new verified ids."
          else
            git commit -m "chore(catalog): add verified Nxsha playback ids"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Upload the resolve report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxsha-playback-resolve
          path: data/catalog-playback-resolve.json
          if-no-files-found: ignore
