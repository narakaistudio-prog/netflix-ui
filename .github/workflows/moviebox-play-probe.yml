name: MovieBox play probe

# Diagnostic only — manual dispatch. Answers: kya MovieBox ke stream URL seedha
# browser me chal sakte hain (bina proxy), ya nahi. Kuch deploy nahi karta.
on:
  # GitHub `workflow_dispatch` sirf default branch ki file par chalta hai, isliye
  # branch par test karne ka rasta: draft PR + pull_request event.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      title:
        description: 'Search title (stream wala test)'
        required: false
        default: 'Avatar'
      subject_id:
        description: 'MovieBox subjectId'
        required: false
        default: '4151920426815471968'
      detail_path:
        description: 'MovieBox detailPath (slug)'
        required: false
        default: 'mandaadi-hindi-qxUx1r3QHW4'
      se:
        description: 'Season (0 = movie)'
        required: false
        default: '0'
      ep:
        description: 'Episode (0 = movie)'
        required: false
        default: '0'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe MovieBox play API + CDN headers
        env:
          PROBE_TITLE: ${{ inputs.title || 'Avatar' }}
        run: |
          set -o pipefail
          # --title par pehle search hoti hai (jo title asli me stream deta hai).
          node scripts/probe-moviebox-play.mjs --title "${PROBE_TITLE:-Avatar}" 2>&1 | tee probe.log
      # Runner ke logs alag host par hote hain; result PR comment me daal dete
      # hain, taaki `gh api` se hi padha ja sake.
      - name: Post result as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### MovieBox play probe'
            echo '```'
            tail -c 5000 probe.log || true
            echo '```'
          } > body.md
          gh pr comment "$PR" --body-file body.md || cat body.md
