name: AV probe (temporary)
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe audio endpoint
        run: node scripts/probe-audio-endpoint.mjs 2>&1 | tee av-probe.log
      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo '### Audio endpoint probe'; echo '```'; cat av-probe.log; echo '```'; } > body.md
          gh pr comment "$PR" --body-file body.md || cat body.md
