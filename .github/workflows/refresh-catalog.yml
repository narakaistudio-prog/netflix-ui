name: Refresh Netflix India catalog

on:
  schedule:
    # Daily ~02:30 IST
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Catalog operation to run'
        required: false
        default: full
        type: choice
        options:
          - full
          - enrich-existing

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Public full-catalog discovery works without keys. If it is unavailable,
      # the script falls back to FlixPatrol Top 10; OMDb enriches discovered
      # titles with metadata and season/episode totals server-side.
      - name: Refresh catalog
        run: node scripts/refresh-catalog.mjs
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          CATALOG_DISCOVERY: ${{ inputs.mode || 'full' }}

      - name: Commit updated catalog
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/movies.json assets/posters
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore(catalog): daily Netflix India refresh"
            git push origin HEAD:${{ github.ref_name }}
          fi
