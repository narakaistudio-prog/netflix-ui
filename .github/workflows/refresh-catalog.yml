name: Refresh Netflix India catalog

on:
  schedule:
    # Daily ~02:30 IST
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Public FlixPatrol discovery works without keys. OMDb optionally enriches
      # every discovered title with metadata and season/episode totals.
      - name: Refresh catalog
        run: node scripts/refresh-catalog.mjs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

      - name: Commit updated catalog
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/movies.json assets/posters
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore(catalog): daily Netflix India refresh"
            git push origin HEAD:${{ github.ref_name }}
          fi
