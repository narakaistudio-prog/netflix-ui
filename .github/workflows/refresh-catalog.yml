name: Refresh Netflix India catalog

on:
  # Run the refresh after catalog-source changes land on this session branch;
  # the hosted runner can reach the public JustWatch reader reliably.
  push:
    branches:
      - arena/01a0c471-netflix-ui
  schedule:
    # Daily ~02:30 IST
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Catalog operation to run'
        required: false
        default: full
        type: choice
        options:
          - full
          - refresh-current
          - enrich-existing
          - refresh-top10

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Public full-catalog discovery works without keys. If it is unavailable,
      # the script falls back to FlixPatrol Top 10; OMDb enriches discovered
      # titles with metadata and season/episode totals server-side.
      - name: Refresh catalog
        run: |
          mode="${{ inputs.mode }}"
          if [ -z "$mode" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              mode="refresh-current"
            else
              mode="full"
            fi
          fi
          echo "Catalog mode: $mode"
          CATALOG_DISCOVERY="$mode" node scripts/refresh-catalog.mjs
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}

      - name: Commit updated catalog
        run: |
          git config user.name "netflix-catalog-bot"
          git config user.email "netflix-catalog-bot@users.noreply.github.com"
          git add data/movies.json assets/posters
          if git diff --cached --quiet; then
            echo "No catalog changes."
          else
            git commit -m "chore(catalog): daily Netflix India refresh"
            git push origin HEAD:${{ github.ref_name }}
          fi
